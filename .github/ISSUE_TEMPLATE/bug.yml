name: Bug
description: 결함 제보
title: "🐛 "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: 버그 설명
      description: 실제 동작과 기대 동작, 발생 환경을 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 재현 방법
      description: 문제를 재현하는 순서를 단계별로 적어 주세요.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 스크린샷 / 로그
      description: 오류 화면, 로그, 기기/앱 버전 등 확인 자료를 적어 주세요.
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: 비고
      description: 원인 추정이나 대응 후보 등 추가 내용을 적어 주세요.
    validations:
      required: false
