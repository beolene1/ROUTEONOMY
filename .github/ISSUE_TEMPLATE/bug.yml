name: Bug
description: 결함 수정
title: "fix: "
labels: ["bug"]
body:
  - type: textarea
    id: purpose
    attributes: { label: 목적, description: 기대 동작과 문제를 적어 주세요. }
    validations: { required: true }
  - type: textarea
    id: scope
    attributes: { label: 작업 범위, description: 수정할 영역과 제외 범위를 적어 주세요. }
    validations: { required: true }
  - type: textarea
    id: done
    attributes: { label: 완료 조건, description: 재현 및 해결 완료 조건을 적어 주세요. }
    validations: { required: true }
  - type: textarea
    id: verify
    attributes: { label: 검증 방법, description: 회귀 확인 방법을 적어 주세요. }
    validations: { required: true }
