name: Feature
description: 기능 추가
title: "feat: "
labels: ["feature"]
body:
  - type: textarea
    id: purpose
    attributes:
      label: 배경 및 목적
      description: 현재 문제와 이 기능이 필요한 이유를 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: feature
    attributes:
      label: 기능 설명
      description: 사용자가 보게 될 동작과 제한 사항을 구체적으로 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: 작업할 내용
      description: 구현 단위와 각 단위의 완료·검증 기준을 체크리스트로 적어 주세요.
      placeholder: |
        - [ ] 구현할 내용 및 완료 조건
        - [ ] 자동 테스트/빌드 검증
        - [ ] 화면 또는 기기에서 직접 확인
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: 참고 자료
      description: 관련 이슈, 문서, 코드, 외부 자료를 적어 주세요.
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: 비고
      description: 의존성, 알려진 한계, 사용자 확인이 필요한 내용을 적어 주세요.
    validations:
      required: false
