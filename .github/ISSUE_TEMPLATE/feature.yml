name: Feature
description: 기능 추가
title: "feat: "
labels: ["feature"]
body:
  - type: textarea
    id: purpose
    attributes: { label: 목적, description: 해결하려는 사용자 요구를 적어 주세요. }
    validations: { required: true }
  - type: textarea
    id: scope
    attributes: { label: 작업 범위, description: 포함/제외 범위를 적어 주세요. }
    validations: { required: true }
  - type: textarea
    id: done
    attributes: { label: 완료 조건, description: 관찰 가능한 완료 조건을 적어 주세요. }
    validations: { required: true }
  - type: textarea
    id: verify
    attributes: { label: 검증 방법, description: 자동 검사와 직접 확인을 구분해 주세요. }
    validations: { required: true }
